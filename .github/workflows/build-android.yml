name: Build Android APK

# بیلد را واچ‌داگ (IVAagent) بعد از هر فیکس تریگر می‌کند؛
# اجرای دستی هم از تب Actions ممکن است. با هر push بیلد گرفته نمی‌شود.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: |
          ver="$(tr -d '\r\n ' < version.txt)"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "APP_VERSION=$ver"
          # buildozer مقدار version را با APP_VERSION جایگزین می‌کند
          # (set_config_from_envs) و p4a نمی‌تواند '2.0.80-beta' را به
          # versionCode عددی تبدیل کند (int('80-beta') در make_package).
          # پس versionCode را با همان فرمول p4a از پیشوند عددی نسخه حساب
          # می‌کنیم و جدا با android.numeric_version می‌دهیم.
          num="$(printf '%s' "$ver" | sed -E 's/^([0-9]+(\.[0-9]+)*).*/\1/')"
          code=0
          for part in $(printf '%s' "$num" | tr '.' ' '); do
            code=$((code * 100 + part))
          done
          minsdk="$(grep -E '^android\.minapi' buildozer.spec | head -1 | sed -E 's/[^0-9]//g')"
          : "${minsdk:=24}"
          echo "APP_ANDROID_NUMERIC_VERSION=10${minsdk}${code}" >> "$GITHUB_ENV"
          echo "APP_ANDROID_NUMERIC_VERSION=10${minsdk}${code}"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v1
          restore-keys: |
            buildozer-global-v1

      - name: Cache p4a build directory
        uses: actions/cache@v4
        with:
          # دایرکتوری بیلد محلی p4a (رسیپی‌های کامپایل‌شده مثل opencv) —
          # بیلدهای بعدی افزایشی می‌شوند و ۵۰ دقیقه کامپایل تکرار نمی‌شود.
          path: .buildozer
          key: p4a-build-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            p4a-build-v1-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install "cython==0.29.33" buildozer
          buildozer --version

      - name: Prepare p4a venv (pip pin)
        run: |
          # حذف venv کش‌شده‌ی خراب p4a تا تازه ساخته شود؛ رسیپی‌های کامپایل‌شده
          # دست‌نخورده می‌مانند (بیلد افزایشی).
          rm -rf .buildozer/android/platform/build-*/build/venv
          # علت فیکس: p4a به‌ازای هر arch یک‌بار «python -m venv venv» را روی همان
          # دایرکتوری اجرا می‌کند. در arch اول، «pip install -U pip» نسخه‌ی venv را
          # به آخرین نسخه‌ی PyPI (مثلاً 26.x) ارتقا می‌دهد؛ ولی در arch دوم،
          # ensurepip نسخه‌ی قدیمیِ باندل‌شده‌ی hostpython (مثلاً 25.3) را روی آن
          # نصب می‌کند. این دانگریدِ pipِ در حال اجرا، فایل‌هایش را قاطی می‌کند
          # (installer.py جدید + exceptions.py قدیمی) و از آن به بعد هر فراخوانی
          # pip با «ImportError: cannot import name 'BuildDependencyInstallError'»
          # می‌میرد (مشاهده‌شده در ران 37592892831).
          # راه‌حل: pip را روی همان نسخه‌ی باندل‌شده‌ی hostpython پین می‌کنیم تا
          # «pip install -U pip» عملاً no-op شود و venv در هر دو arch یکدست بماند.
          HP_PY="$(ls .buildozer/android/platform/build-*/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python 2>/dev/null | head -1)"
          BUNDLED_PIP=""
          if [ -n "$HP_PY" ]; then
            BUNDLED_PIP="$("$HP_PY" -c 'import ensurepip; print(ensurepip.version())' 2>/dev/null)"
          fi
          : "${BUNDLED_PIP:=25.3}"
          printf 'pip==%s\n' "$BUNDLED_PIP" > /tmp/pip-constraint.txt
          echo "PIP_CONSTRAINT=/tmp/pip-constraint.txt" >> "$GITHUB_ENV"
          echo "venv pip pinned to $BUNDLED_PIP"

      - name: Patch p4a (accept android wheels)
        run: |
          # روی cold-cache، buildozer خودش p4a را وسط بیلد کلون می‌کند؛ اگر
          # دایرکتوری‌اش نبود، خودمان با همان آدرس/برانچی که buildozer انتظار
          # دارد کلون می‌کنیم تا از همین کپیِ پچ‌شده استفاده کند.
          P4A_DIR=.buildozer/android/platform/python-for-android
          if [ ! -d "$P4A_DIR" ]; then
            mkdir -p .buildozer/android/platform
            git clone -b master --single-branch \
              https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          python3 .github/workflows/patch_p4a.py

      - name: Build APK
        run: |
          # گرِدل پلاگین اندروید (AGP 8.x) به جاوا ۱۷ نیاز دارد؛ بدون JAVA_HOME
          # درست، gradlew از جاوا ۱۱ پیش‌فرض رانر استفاده می‌کند و با
          # «Android Gradle plugin requires Java 17» می‌میرد (مشاهده‌شده در ران ۱۲).
          # نکته: ${{ env.JAVA_HOME_17_X64 }} همیشه خالی است چون متغیر محیطی رانر
          # در کانتکست env گیت‌هاب نیست؛ باید در شل خوانده شود.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          test -x "$JAVA_HOME/bin/javac" || { echo "FAIL: JAVA_HOME_17_X64 usable نیست: [$JAVA_HOME]"; exit 1; }
          "$JAVA_HOME/bin/java" -version
          buildozer android debug

      - name: Rename APK (نام خروجی با ANDROID)
        run: |
          mkdir -p dist
          apk="$(ls bin/*.apk | head -n 1)"
          test -n "$apk" || { echo "FAIL: APK ساخته نشد."; exit 1; }
          out="dist/IAS-Viewer-ANDROID-v$APP_VERSION.apk"
          cp "$apk" "$out"
          ls -la "$out"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IAS-Viewer-ANDROID-v${{ env.APP_VERSION }}
          path: dist/IAS-Viewer-ANDROID-v${{ env.APP_VERSION }}.apk

